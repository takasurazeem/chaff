name: CI

# Wave 0 of the roadmap: make the loop verifiable before adding depth.
#
# Now that the engine lives in `chaff-core`, most of this workflow needs no GUI
# dependencies at all — which is why the engine was split out. See Cargo.toml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The engine: the tests that actually verify behaviour.
  # ---------------------------------------------------------------------------
  engine:
    name: Engine tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # A green build that tests nothing is worse than a red one.
      #
      # This guard exists because it already happened: when the engine moved from
      # `src-tauri/src/core` to the `chaff-core` crate, the previous workflow's
      # `cargo test --lib` (run with `working-directory: src-tauri`) began compiling a
      # crate that contains no tests. It reported `0 passed` and a green tick, on every
      # platform, indefinitely. Asserting a minimum count is the cheapest way to make
      # that class of mistake impossible to repeat.
      - name: Engine unit tests
        shell: bash
        run: |
          set -o pipefail
          cargo test -p chaff-core 2>&1 | tee engine-tests.log
          PASSED=$(grep -oE '[0-9]+ passed' engine-tests.log | awk '{s+=$1} END {print s+0}')
          echo "engine tests passed: $PASSED"
          if [ "$PASSED" -lt 50 ]; then
            echo "::error::Expected at least 50 engine tests to pass, saw $PASSED. If tests were legitimately removed, lower this floor deliberately; do not delete the guard."
            exit 1
          fi

      # The real-file corpus is ~47 MB and gitignored, so these tests skip by design on
      # a fresh checkout. Run them anyway, without capture, so the skip is visible in the
      # log rather than hiding behind a "11 passed" line that did nothing.
      - name: Corpus integration tests (skip visibly when the corpus is absent)
        shell: bash
        run: |
          set -o pipefail
          cargo test -p chaff-core --test corpus -- --nocapture 2>&1 | tee corpus-tests.log
          SKIPPED=$(grep -c '^SKIP' corpus-tests.log || true)
          if [ "$SKIPPED" -gt 0 ]; then
            echo "::notice::$SKIPPED corpus test(s) skipped — fixtures/corpus/ is absent. Run tools/fixtures/fetch_corpus.py to enable them."
          fi

      - name: Grid benchmark at 50k photographs
        # A budget, not a printout. A benchmark that only reports is one nobody reads, and
        # the regression this catches is an order of magnitude — a query that lost its index,
        # an accidental O(n²) — not a 20% drift. Budgets are loose because a shared runner
        # can double any number, and a flaky check gets disabled.
        run: cargo run --release -p chaff-core --example grid_bench

      - name: Clippy
        shell: bash
        run: cargo clippy -p chaff-core --all-targets -- -D warnings
        continue-on-error: true

      - name: Formatting
        shell: bash
        run: cargo fmt --all -- --check
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # The shell: proves the Tauri crate still compiles. This is the only job that needs
  # a desktop stack, and it deliberately does not run tests — there are none there.
  # ---------------------------------------------------------------------------
  app-compiles:
    name: Tauri shell compiles (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            libssl-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `tauri::generate_context!` reads `frontendDist`, so it must exist before cargo
      # can expand the macro.
      - name: Build frontend
        run: pnpm build

      - name: cargo check
        run: cargo check -p chaff

  # ---------------------------------------------------------------------------
  web:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: View types match their Rust structs
        # Tauri serialises return values exactly as the Rust struct is written, so a
        # TypeScript interface declaring `opId` against a Rust `op_id` compiles cleanly and
        # is `undefined` at runtime. The whole trash panel had this; restore and purge were
        # broken and nothing said so.
        run: python3 tools/check_view_fields.py

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
