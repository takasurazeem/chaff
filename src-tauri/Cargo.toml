[package]
name = "chaff"
version = "0.1.0"
description = "Local-first, cross-platform photo culling workstation"
authors = ["Sameer"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows).
name = "chaff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The engine. All indexing, pairing, imaging and scoring lives there, free of Tauri, so
# it stays testable without a webview. This crate is only the shell.
chaff-core = { path = "../crates/chaff-core" }
chaff-faces = { path = "../crates/chaff-faces" }

# `protocol-asset` is what serves thumbnails to the webview without pushing bytes
# through the JSON IPC bridge. The scope is set in tauri.conf.json and covers the
# thumbnail cache only.
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.1"
env_logger = "0.11.11"
log = "0.4.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[features]
# **Required for a release build.** Without it the binary serves `devUrl`
# (`http://localhost:1420`) instead of the bundled frontend, so a standalone build shows
# "Could not connect to localhost: Connection Refused".
#
# `tauri build` enables this automatically, which is why the macOS bundle worked and the
# Linux one — built with a bare `cargo build --release` — did not. Any build that does not
# go through the Tauri CLI must pass `--features custom-protocol`.
default = []
custom-protocol = ["tauri/custom-protocol"]
