[package]
name = "chaff-ffi"
version = "0.1.0"
edition = "2021"
publish = false

# **The boundary, and nothing else.**
#
# `chaff-core` and `chaff-faces` have no GUI dependencies and no FFI annotations, and they
# stay that way: the engine keeps building as a plain library and `chaff-cli` keeps working.
# Everything a Swift caller needs to cross the language boundary lives here — the exported
# wrappers, the type conversions, the error mapping — and **no logic**.
#
# The rule that keeps it honest: if a wrapper ever needs an `if`, the logic belongs in the
# engine, where both shells get it and where it can be tested without Swift.
[dependencies]
chaff-core = { path = "../chaff-core" }
uniffi = { version = "0.32", features = ["cli"] }
thiserror = "2"
log = "0.4"

[lib]
# `cdylib` for a dynamic library Swift links against; `staticlib` so a release build can
# embed it and ship one binary rather than a binary and a dylib that must stay beside it.
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
# The binding generator. A binary rather than a `cargo install` so the version generating
# the Swift **cannot drift** from the version the library was built with — a mismatch
# produces bindings that compile and then misbehave at the boundary.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dev-dependencies]
tempfile = "3.27.0"
