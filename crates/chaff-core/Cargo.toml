[package]
name = "chaff-core"
version = "0.1.0"
edition = "2021"
description = "Chaff's engine: file classification, pair resolution, imaging and scoring. No GUI, no Tauri, no webview."
license = "MIT"

# This crate deliberately has no Tauri dependency and no GUI dependency of any kind.
#
# Two reasons, and the second one is why it exists as a separate crate at all:
#
# 1. ADR-0001 requires the engine to be free of Tauri types, so the shell can be
#    replaced without rewriting the engine.
# 2. It makes the engine buildable and testable on a machine with no display server
#    and no GTK/WebKit development packages — which is exactly what the Linux build
#    host is. `cargo test -p chaff-core` needs nothing installed; `cargo test` on the
#    app crate needs the full webkit2gtk4.1-devel stack.
#
# Keep it that way. A dependency added here becomes a dependency of every test run on
# every platform.
[dependencies]
# NFC normalisation of filename stems. macOS stores decomposed (NFD), Linux and Windows
# generally do not, so a RAW+JPEG pair matches on Linux and silently fails on a Mac
# after a copy. Correctness dependency, not a convenience.
unicode-normalization = "0.1"

# The catalog. `bundled` compiles SQLite from source, so there is no system libsqlite3
# to install — which is what lets `cargo test -p chaff-core` run on a bare Linux box and
# keeps Windows and macOS identical.
rusqlite = { version = "0.40", features = ["bundled"] }

# Directory traversal that reports errors instead of stopping at the first one.
walkdir = "2"

# Content hashing for the thumbnail cache key and for the pre-move verification that
# ADR-0004 requires before any file is moved.
blake3 = "1"

thiserror = "2"

# A logging facade, not an implementation. `chaff-core` is a library and must not decide
# where log lines go — the CLI writes to stderr, the app to the system log, and tests to
# nowhere at all. Without a logger installed every call here is a no-op, which is why the
# 400-odd tests are unaffected by it.
log = "0.4"

# The trash manifest is JSONL. Hand-rolling JSON for paths means hand-rolling path
# escaping, and a manifest that cannot be parsed is a file that cannot be restored.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cross-platform CPU, memory and disk information for the hardware probe. Chosen over
# shelling out to `sysctl`, `/proc/meminfo` and `df`, each of which needs its own parser
# per platform and its own failure modes.
#
# Pinned below 0.39 deliberately: 0.39 requires rustc 1.95, and this project builds on
# 1.91. Raising the floor for a system-information crate would exclude anyone on a
# slightly older toolchain for no functional gain.
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }

# Decoding and encoding for the thumbnail pipeline. Moved out of dev-dependencies when
# `thumb.rs` landed: the engine now genuinely decodes, rather than only its tests.
# Feature-limited to the formats a photo library actually contains, to keep the build
# and the binary small.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "gif", "bmp"] }

# EXIF parsing, pure Rust. Drives burst grouping (capture time, camera body) and
# exposure-bracket detection, neither of which can be inferred from a filename.
kamadak-exif = "0.6"

# The VLM client. One HTTP client for two request shapes, rather than a dependency
# per feature — and `chaff-faces` already uses it for verified model downloads.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tempfile = "3"
